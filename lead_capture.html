<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SCITBD | Activate Your 30-Day AI Enterprise Trial</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --bg-obsidian: #0a0d14;
            --card-dark: #111827;
            --border-dark: #1e293b;
            --glow-green: #00ff87;
            --glow-shadow: rgba(0, 255, 135, 0.2);
            --text-light: #f1f5f9;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-light);
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        .glow-text {
            color: var(--glow-green);
            text-shadow: 0 0 10px rgba(0, 255, 135, 0.4);
        }

        .card-nano {
            background-color: var(--card-dark);
            border: 1px solid var(--border-dark);
            border-radius: 12px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.5);
        }

        .form-control-dark, .form-select-dark {
            background-color: #0f172a;
            border: 1px solid #334155;
            color: #ffffff;
            border-radius: 8px;
            padding: 12px;
        }

        .form-control-dark:focus, .form-select-dark:focus {
            background-color: #0f172a;
            color: #ffffff;
            border-color: var(--glow-green);
            box-shadow: 0 0 10px var(--glow-shadow);
        }

        .btn-nano {
            background-color: var(--glow-green);
            color: #050811;
            font-weight: 700;
            border: none;
            padding: 14px;
            border-radius: 8px;
            transition: all 0.2s ease-in-out;
        }

        .btn-nano:hover {
            background-color: #00cc6a;
            box-shadow: 0 0 18px rgba(0, 255, 135, 0.5);
        }

        .badge-nano {
            background-color: rgba(0, 255, 135, 0.1);
            color: var(--glow-green);
            border: 1px solid var(--glow-green);
            font-size: 0.8rem;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">

<div class="container" style="max-width: 680px;">
    <div class="card card-nano p-4 p-md-5">
        
        <!-- Header -->
        <div class="text-center mb-4">
            <span class="badge badge-nano px-3 py-2 mb-2">
                <i class="fa-solid fa-bolt me-1"></i> 24/7 AI AUTOMATION ENGINE ACTIVE
            </span>
            <h2 class="fw-bold text-white mb-1">Claim Your Free 30-Day AI Trial</h2>
            <p class="text-muted small">Unlock 95% dark data and automate operations with SCITBD Enterprise Solutions.</p>
        </div>

        <!-- Form -->
        <form id="leadCaptureForm">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label text-light small fw-bold">Full Name *</label>
                    <input type="text" id="client_name" class="form-control form-control-dark" placeholder="e.g. Sarah Jenkins" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light small fw-bold">Work Email *</label>
                    <input type="email" id="email" class="form-control form-control-dark" placeholder="s.jenkins@enterprise.com" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light small fw-bold">Phone / WhatsApp</label>
                    <input type="text" id="phone" class="form-control form-control-dark" placeholder="+1 (555) 019-2834">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light small fw-bold">Company / Organization</label>
                    <input type="text" id="company_name" class="form-control form-control-dark" placeholder="Apex Global Tech">
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light small fw-bold">Target Market / Country *</label>
                    <input type="text" id="country" class="form-control form-control-dark" placeholder="e.g. UAE, USA, UK" required>
                </div>
                <div class="col-md-6">
                    <label class="form-label text-light small fw-bold">Estimated Project Budget ($ USD) *</label>
                    <input type="number" id="deal_value" class="form-control form-control-dark" placeholder="10000" required>
                </div>
                <div class="col-12">
                    <label class="form-label text-light small fw-bold">Primary Capability Interest *</label>
                    <select id="service_line" class="form-select form-select-dark" required>
                        <option value="AI Product Suite (Chatbot / Analytics)">AI Product Suite (Chatbot / Analytics)</option>
                        <option value="ICT Consultancy & Digital Transformation">ICT Consultancy & Digital Transformation</option>
                        <option value="Custom Enterprise Software (ERP/HRM)">Custom Enterprise Software (ERP/HRM)</option>
                        <option value="Humanitarian M&E Software System">Humanitarian M&E Software System</option>
                        <option value="Cybersecurity & Compliance (ISO/GDPR)">Cybersecurity & Compliance (ISO/GDPR)</option>
                    </select>
                </div>
            </div>

            <button type="submit" class="btn btn-nano w-100 mt-4">
                <i class="fa-solid fa-paper-plane me-2"></i> Activate Trial & Dispatch AI Proposal
            </button>
        </form>

        <!-- Response Alert Box -->
        <div id="responseAlert" class="mt-4"></div>

        <!-- Footer Footer Info -->
        <div class="d-flex justify-content-between align-items-center mt-4 pt-3 border-top border-secondary text-muted small" style="font-size: 0.78rem;">
            <span><i class="fa-solid fa-shield-halved text-success me-1"></i> ISO 27001 & GDPR Compliant</span>
            <span>SLA Response: &lt; 2 Hours</span>
        </div>
    </div>
</div>

<script>
document.getElementById('leadCaptureForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    
    const alertBox = document.getElementById('responseAlert');
    alertBox.innerHTML = `<div class="alert alert-info bg-dark text-info border-info"><i class="fa-solid fa-spinner fa-spin me-2"></i> Processing request and triggering AI engines...</div>`;

    const payload = {
        client_name: document.getElementById('client_name').value,
        email: document.getElementById('email').value,
        phone: document.getElementById('phone').value,
        company_name: document.getElementById('company_name').value,
        country: document.getElementById('country').value,
        deal_value: parseFloat(document.getElementById('deal_value').value),
        service_line: document.getElementById('service_line').value,
        campaign_source: 'October SaaS Pilot Landing Page'
    };

    try {
        const response = await fetch('api_webhook.php?action=submit_lead', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });

        const result = await response.json();

        if (result.status === 'success') {
            if (result.ceo_video_escalation) {
                alertBox.innerHTML = `
                    <div class="alert alert-warning bg-dark text-warning border-warning p-3">
                        🚨 <strong>HIGH VALUE ENTERPRISE DEAL DETECTED!</strong><br>
                        ${result.message}<br>
                        <small class="text-light">Priority Escalation: Founder Md Shoeb Lincoln has been notified to send a custom video response within 24 hours.</small>
                    </div>`;
            } else {
                alertBox.innerHTML = `
                    <div class="alert alert-success bg-dark text-success border-success p-3">
                        ✅ <strong>Request Processed Successfully!</strong><br>
                        ${result.message}
                    </div>`;
            }
            document.getElementById('leadCaptureForm').reset();
        } else {
            alertBox.innerHTML = `<div class="alert alert-danger bg-dark text-danger border-danger">❌ Error: ${result.message}</div>`;
        }
    } catch (err) {
        alertBox.innerHTML = `<div class="alert alert-danger bg-dark text-danger border-danger">❌ Server connection failed. Please try again.</div>`;
    }
});
</script>
</body>
</html>
